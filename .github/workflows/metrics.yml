name: Generate Profile Metrics

on:
  # Schedule automatic execution every day at midnight
  schedule:
    - cron: "0 0 * * *"
  # Allows manual triggering from the Actions tab
  workflow_dispatch:
  # Also run when changes are pushed to the main branch
  push:
    branches:
      - main
      - master

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Top Languages & Stats Card
        uses: lowlighter/metrics@latest
        with:
          # Your GitHub token stored in repository secrets
          token: ${{ secrets.METRICS_TOKEN }}
          
          # Target output file name
          filename: github-metrics.svg
          
          # Base display settings
          base: header, activity, community
          
          # Theme styling matching your README
          config_theme: tokyonight
          
          # Languages Plugin setup
          plugin_languages: yes
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%
